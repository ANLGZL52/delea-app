# DLA+ iOS build — Klon kökü = repo kökü; Flutter: mobile/
# Codemagic UI: "Repository" altında EK working directory KULLANMA (veya sadece ./).
# İmzalama + TestFlight: https://docs.codemagic.io/flutter-publishing/publishing-to-app-store/
workflows:
  ios-workflow:
    name: DLA+ iOS
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      # Codemagic must fetch App Store distribution cert + provisioning profile.
      # Repository → Integrations: App Store Connect (API key). Same Apple Team as the App ID.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.delea.app
    scripts:
      - name: Initialize keychain for code signing
        script: keychain initialize
      - name: Get packages & CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile"
          flutter pub get
          cd ios
          pod install
      - name: Apply provisioning profiles to Xcode project
        script: |
          set -e
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/mobile/ios/Runner.xcodeproj" \
            --archive-method app-store
      - name: Flutter build IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile"
          flutter build ipa --release
    artifacts:
      - mobile/build/ios/ipa/*.ipa
    # publishing: UI → App settings → iOS code signing + Distribution: App Store
    # → App Store Connect (TestFlight) integration
