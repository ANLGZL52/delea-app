# DLA+ iOS — manual signing: delea_dist_cert + delea_app_store (Codemagic UI).
# Optional app env (Secret): DELEA_P12_PASSWORD = .p12 export password
workflows:
  ios-workflow:
    name: DLA+ iOS
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Codemagic delea"
    environment:
      groups:
        - delea_ios   # App env: DELEA_P12_PASSWORD (Secret) bu grupta
      flutter: stable
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - profile: delea_app_store
            environment_variable: DELEA_PROFILE_PATH
        certificates:
          - certificate: delea_dist_cert
            environment_variable: DELEA_CERT_PATH
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Install certificate and provisioning profile
        script: |
          set -e
          set -x
          CERT_PATH="${DELEA_CERT_PATH:-}"
          PROFILE_PATH="${DELEA_PROFILE_PATH:-}"
          CERT_PASSWORD="${DELEA_P12_PASSWORD:-${CM_CERTIFICATE_PASSWORD:-}}"
          # Fallback: Codemagic MobileDevice dirs
          if [ -z "$CERT_PATH" ] && [ -d "$HOME/Library/MobileDevice/Certificates" ]; then
            CERT_PATH="$(find "$HOME/Library/MobileDevice/Certificates" -maxdepth 1 -type f \( -name '*.p12' -o -name '*.P12' \) 2>/dev/null | head -1)"
          fi
          if [ -z "$PROFILE_PATH" ] && [ -d "$HOME/Library/MobileDevice/Provisioning Profiles" ]; then
            PROFILE_PATH="$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -maxdepth 1 -name '*.mobileprovision' 2>/dev/null | head -1)"
          fi
          if [ -z "$CERT_PATH" ] || [ ! -f "$CERT_PATH" ]; then
            echo "ERROR: No certificate file. DELEA_CERT_PATH=$DELEA_CERT_PATH"
            ls -la "$HOME/Library/MobileDevice/Certificates" 2>/dev/null || true
            exit 1
          fi
          echo "Using certificate: $CERT_PATH"
          if [ -n "$CERT_PASSWORD" ]; then
            keychain add-certificates --certificate "$CERT_PATH" --certificate-password "$CERT_PASSWORD"
          else
            keychain add-certificates --certificate "$CERT_PATH"
          fi
          if [ -n "$PROFILE_PATH" ] && [ -f "$PROFILE_PATH" ]; then
            PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"
            mkdir -p "$PROFILES_HOME"
            cp "$PROFILE_PATH" "$PROFILES_HOME/$(uuidgen).mobileprovision"
            echo "Installed profile from $PROFILE_PATH"
          fi
          echo "--- Keychain identities ---"
          security find-identity -v -p codesigning
      - name: Get packages and CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile"
          flutter pub get
          cd ios && pod install
      - name: Apply provisioning profiles to Xcode project
        script: |
          set -e
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/mobile/ios/Runner.xcodeproj" \
            --archive-method app-store
      - name: Flutter build IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile"
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          ls -la build/ios/ipa/
          if [ -n "${CM_BUILD_OUTPUT_DIR:-}" ]; then
            mkdir -p "$CM_BUILD_OUTPUT_DIR"
            cp -v build/ios/ipa/*.ipa "$CM_BUILD_OUTPUT_DIR/" || true
          fi
    artifacts:
      - mobile/build/ios/ipa/*.ipa
    publishing:
      scripts:
        - name: Publish to App Store Connect
          script: |
            set -e
            ROOT="${CM_BUILD_DIR:?}"
            IPA_FILE=""
            if [ -n "${CM_BUILD_OUTPUT_DIR:-}" ] && [ -d "$CM_BUILD_OUTPUT_DIR" ]; then
              IPA_FILE="$(find "$CM_BUILD_OUTPUT_DIR" -maxdepth 3 -type f -name '*.ipa' 2>/dev/null | head -1)"
            fi
            if [ -z "$IPA_FILE" ]; then
              IPA_FILE="$(find "$ROOT/mobile/build/ios/ipa" -maxdepth 1 -type f -name '*.ipa' 2>/dev/null | head -1)"
            fi
            if [ -z "$IPA_FILE" ] || [ ! -f "$IPA_FILE" ]; then
              echo "ERROR: No .ipa found"
              find "$ROOT" -name '*.ipa' -type f 2>/dev/null || true
              exit 1
            fi
            app-store-connect publish --path "$IPA_FILE" --verbose
