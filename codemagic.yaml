# DLA+ iOS build — Klon kökü = repo kökü; Flutter: mobile/
# Codemagic UI: "Repository" altında EK working directory KULLANMA (veya sadece ./).
# İmzalama + TestFlight: https://docs.codemagic.io/flutter-publishing/publishing-to-app-store/
workflows:
  ios-workflow:
    name: DLA+ iOS
    max_build_duration: 120
    instance_type: mac_mini_m1
    # Must match Team integrations → Apple Developer Portal → App Store Connect API key *name*.
    integrations:
      app_store_connect: "Codemagic delea"
    environment:
      flutter: stable
      xcode: latest
      # Codemagic must fetch App Store distribution cert + provisioning profile.
      # Repository → Integrations: App Store Connect (API key). Same Apple Team as the App ID.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.delea.app
    scripts:
      - name: Initialize keychain for code signing
        script: keychain initialize
      - name: Get packages & CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile"
          flutter pub get
          cd ios
          pod install
      - name: Apply provisioning profiles to Xcode project
        script: |
          set -e
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/mobile/ios/Runner.xcodeproj" \
            --archive-method app-store
      - name: Flutter build IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile"
          flutter build ipa --release
    artifacts:
      - mobile/build/ios/ipa/*.ipa
    publishing:
      # Uses Team integration JWT (integrations.app_store_connect). Explicit path for mobile/ monorepo IPA.
      scripts:
        - name: Publish IPA to App Store Connect
          script: |
            set -e
            set -x
            IPA_DIR="$CM_BUILD_DIR/mobile/build/ios/ipa"
            ls -la "$IPA_DIR"
            IPA_FILE="$(find "$IPA_DIR" -maxdepth 1 -name '*.ipa' | head -1)"
            if [ -z "$IPA_FILE" ] || [ ! -f "$IPA_FILE" ]; then
              echo "ERROR: No .ipa under $IPA_DIR"
              exit 1
            fi
            app-store-connect publish --path "$IPA_FILE" --verbose
