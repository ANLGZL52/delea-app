# DLA+ iOS — automatic signing via App Store Connect integration "Codemagic delea".
# Manuel .p12 (delea_dist_cert) revoke/expired olabildiği için otomatik imzalamaya
# geçildi: codemagic her build'de App Store Connect API anahtarıyla taze dağıtım
# sertifikası + provizyon profili üretir (App Manager yetkisi gerekir).
workflows:
  ios-workflow:
    name: DLA+ iOS
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Codemagic delea"
    environment:
      groups:
        - delea_ios
      flutter: stable
      xcode: latest
    scripts:
      - name: Set up code signing (fresh cert + profile)
        script: |
          set -e
          set -x
          keychain initialize
          # Eski/zehirli profilleri temizle (revoke sertifikaya bağlı "delea_app_store" dahil).
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"/* 2>/dev/null || true
          # Sertifika oluşturmak için 2048-bit private key üret.
          PK="$HOME/cm_cert_key.pem"
          openssl genrsa -out "$PK" 2048
          # App Store Connect API (entegrasyon "Codemagic delea") ile com.delea.app için
          # GEÇERLİ dağıtım sertifikası + App Store profili getir; yoksa OLUŞTUR.
          app-store-connect fetch-signing-files "com.delea.app" \
            --type IOS_APP_STORE \
            --certificate-key @file:"$PK" \
            --create
          keychain add-certificates
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/mobile/ios/Runner.xcodeproj" \
            --archive-method app-store
          echo "--- Keychain identities ---"
          security find-identity -v -p codesigning
      - name: Get packages and CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile"
          flutter pub get
          cd ios && pod install
      - name: Flutter build IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile"
          # use-profiles tarafından üretilen export options'ı kullan (otomatik imzalama).
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE_URL=https://delea-app-production.up.railway.app
          ls -la build/ios/ipa/
          if [ -n "${CM_BUILD_OUTPUT_DIR:-}" ]; then
            mkdir -p "$CM_BUILD_OUTPUT_DIR"
            cp -v build/ios/ipa/*.ipa "$CM_BUILD_OUTPUT_DIR/" || true
          fi
    artifacts:
      - mobile/build/ios/ipa/*.ipa
    publishing:
      scripts:
        - name: Publish to App Store Connect
          script: |
            set -e
            ROOT="${CM_BUILD_DIR:?}"
            IPA_FILE=""
            if [ -n "${CM_BUILD_OUTPUT_DIR:-}" ] && [ -d "$CM_BUILD_OUTPUT_DIR" ]; then
              IPA_FILE="$(find "$CM_BUILD_OUTPUT_DIR" -maxdepth 3 -type f -name '*.ipa' 2>/dev/null | head -1)"
            fi
            if [ -z "$IPA_FILE" ]; then
              IPA_FILE="$(find "$ROOT/mobile/build/ios/ipa" -maxdepth 1 -type f -name '*.ipa' 2>/dev/null | head -1)"
            fi
            if [ -z "$IPA_FILE" ] || [ ! -f "$IPA_FILE" ]; then
              echo "ERROR: No .ipa found"
              find "$ROOT" -name '*.ipa' -type f 2>/dev/null || true
              exit 1
            fi
            app-store-connect publish --path "$IPA_FILE" --verbose
