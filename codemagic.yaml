# DLA+ iOS — manual code signing: UI reference names must match exactly.
# Certificates: delea_dist_cert | Profile: delea_app_store
workflows:
  ios-workflow:
    name: DLA+ iOS
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: "Codemagic delea"
    environment:
      flutter: stable
      xcode: latest
      # Use uploaded .p12 + profile (NOT distribution_type fetch — that skips UI uploads).
      ios_signing:
        provisioning_profiles:
          - delea_app_store
        certificates:
          - delea_dist_cert
    scripts:
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Verify signing identities in keychain
        script: |
          set -e
          echo "--- Code signing identities (expect Apple Distribution) ---"
          security find-identity -v -p codesigning
          echo "--- Provisioning profiles ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || true
      - name: Get packages and CocoaPods
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile"
          flutter pub get
          cd ios && pod install
      - name: Apply provisioning profiles to Xcode project
        script: |
          set -e
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/mobile/ios/Runner.xcodeproj" \
            --archive-method app-store
      - name: Flutter build IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/mobile"
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          ls -la build/ios/ipa/
          if [ -n "${CM_BUILD_OUTPUT_DIR:-}" ]; then
            mkdir -p "$CM_BUILD_OUTPUT_DIR"
            cp -v build/ios/ipa/*.ipa "$CM_BUILD_OUTPUT_DIR/" || true
          fi
    artifacts:
      - mobile/build/ios/ipa/*.ipa
    publishing:
      scripts:
        - name: Publish to App Store Connect
          script: |
            set -e
            ROOT="${CM_BUILD_DIR:?}"
            IPA_FILE=""
            if [ -n "${CM_BUILD_OUTPUT_DIR:-}" ] && [ -d "$CM_BUILD_OUTPUT_DIR" ]; then
              IPA_FILE="$(find "$CM_BUILD_OUTPUT_DIR" -maxdepth 3 -type f -name '*.ipa' 2>/dev/null | head -1)"
            fi
            if [ -z "$IPA_FILE" ]; then
              IPA_FILE="$(find "$ROOT/mobile/build/ios/ipa" -maxdepth 1 -type f -name '*.ipa' 2>/dev/null | head -1)"
            fi
            if [ -z "$IPA_FILE" ] || [ ! -f "$IPA_FILE" ]; then
              echo "ERROR: No .ipa found"
              find "$ROOT" -name '*.ipa' -type f 2>/dev/null || true
              exit 1
            fi
            app-store-connect publish --path "$IPA_FILE" --verbose
