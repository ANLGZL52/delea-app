name: mobile
description: "DLA+ — DLA / kabin mülakatı için İngilizce konuşma pratiği (Flutter)."
publish_to: 'none'

version: 1.0.8+18

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  record: ^6.1.2
  permission_handler: ^11.0.0
  record_windows: ^1.0.7
  path_provider: ^2.1.5
  flutter_tts: ^3.8.0
  shared_preferences: ^2.3.2   # plan kotası & premium bayrağı
  in_app_purchase: ^3.1.8      # Store ödemeleri için eklendi
  url_launcher: ^6.3.1
  fl_chart: ^0.69.0            # Bar/radar chart için
  device_preview: ^1.3.1
  firebase_core: ^3.8.1         # Tüm platformlarda Firebase (Hosting / domain ile uyum)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  config:
    # CI: avoid Podfile/SPM rewrite each build (can break Distribution signing on export).
    enable-swift-package-manager: false
  uses-material-design: true

  assets:
    - assets/pexels_images/
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21
  # Play / adaptive: logo siyah arka planlı
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/app_icon.png
  web:
    generate: true
